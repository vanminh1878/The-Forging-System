# CodeRabbit configuration - https://docs.coderabbit.ai/reference/configuration
# Validate with: https://docs.coderabbit.ai/configuration/yaml-validator
language: "vi-VN"          # review comments in Vietnamese (code, identifiers and code comments stay English)
early_access: false
tone_instructions: "Ngắn gọn, cụ thể, chỉ ra rủi ro thực sự (đúng nghiệp vụ, bảo mật, dữ liệu). Không nhận xét về style đã được ESLint/Prettier xử lý."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main", "develop"]
    ignore_title_keywords: ["WIP", "DO NOT REVIEW"]
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/package-lock.json"
    - "!mobile/pubspec.lock"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!mobile/assets/fonts/**"
  path_instructions:
    - path: "backend/db/migrations/**"
      instructions: |
        Migrations are forward-only and immutable once merged. Flag any edit of an existing migration file.
        New tables must have tenant_id + row level security policy; check indexes for new foreign keys and query paths;
        point_transactions / audit_logs / inventory_movements are append-only (never UPDATE/DELETE them).
    - path: "backend/src/modules/**"
      instructions: |
        Layering: routes -> service -> repository. Routes validate input with zod and only call services;
        SQL lives only in repositories; services hold business rules and never touch req/res.
        Cross-module access only via exported ports or domain events, never another module's repository.
        point_transactions may only be written through PointsPort.award (idempotency key required for retried actions).
        Business logic must use clock.now() (never new Date()) and settings values (no hardcoded business numbers).
        Check every mutating endpoint for: role guard, input validation, audit logging for staff/admin actions,
        and race conditions (use row locks / unique constraints / idempotency).
    - path: "backend/src/**/*.routes.ts"
      instructions: "Every route needs requireAuth + an explicit requireRoles guard and zod validation of params, query and body."
    - path: "backend/tests/**"
      instructions: "Tests must be deterministic (use the injectable clock, no sleeping), independent of each other, and assert business outcomes, not implementation details."
    - path: "mobile/lib/**"
      instructions: |
        Flutter + Riverpod, feature-first folders (data / domain / presentation). No business rules in widgets;
        no BuildContext across async gaps without a mounted check; dispose controllers; use const constructors;
        all colors/text styles from the theme tokens (no hardcoded hex in widgets); every list/screen needs
        loading, empty and error states; user-facing strings are Vietnamese; secrets/tokens only in secure storage.
    - path: "mobile/test/**"
      instructions: "Widget/unit tests must not hit the network; override Riverpod providers with fakes."
    - path: "docker/**"
      instructions: "Never bake secrets into images; runtime DB role must stay non-owner so row level security applies."
    - path: ".github/**"
      instructions: "Pin action versions; avoid exposing secrets to forks."
  tools:
    eslint:
      enabled: true
    markdownlint:
      enabled: false
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
