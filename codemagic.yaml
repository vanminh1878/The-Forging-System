workflows:
  ios-unsigned:
    name: iOS unsigned release validation
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter packages
        script: cd mobile && flutter pub get
      - name: Analyze Dart code
        script: cd mobile && flutter analyze
      - name: Build iOS without signing
        script: cd mobile && flutter build ios --release --no-codesign
    artifacts:
      - mobile/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
